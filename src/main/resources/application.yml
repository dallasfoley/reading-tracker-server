spring:
  application:
    name: reading-tracker-server
  threads:
    virtual:
      enabled: true
  cache:
    type: redis
  docker:
    compose:
      enabled: false
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${AUTH0_DOMAIN}
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USER}
    password: ${DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DATABASE_MAX_POOL_SIZE:10}
      minimum-idle: ${DATABASE_MIN_IDLE:2}
      connection-timeout: 5s
      validation-timeout: 2s
      max-lifetime: 25m
  config:
    import: optional:file:.env[.properties]
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        "[format_sql]": true
  data:
    redis:
      url: ${REDIS_URL}
      username: ${REDIS_USER}
      password: ${REDIS_PASSWORD}
      connect-timeout: 2s
      timeout: 2s
  lifecycle:
    timeout-per-shutdown-phase: 30s

server:
  port: 8080
  shutdown: graceful
  forward-headers-strategy: framework
  tomcat:
    connection-timeout: 5s
    keep-alive-timeout: 20s
    max-keep-alive-requests: 100

logging:
  level:
    org.springframework.security: INFO

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus, metrics
  endpoint:
    health:
      show-details: when-authorized   # never / always / when-authorized
      probes:
        enabled: true                 # enables /liveness and /readiness
  metrics:
    tags:
      application: ${spring.application.name}  # adds tag to every metric
  info:
    git:
      mode: full    # expose git commit SHA, branch in /info
    build:
      enabled: true # expose Maven/Gradle build metadata
  otlp:
    metrics:
      export:
        url: http://localhost:4318/v1/metrics
    tracing:
      endpoint: http://localhost:4318/v1/traces
    logging:
      export:
        endpoint: http://localhost:4318/v1/logs

open-library:
  base-url: https://openlibrary.org
  connect-timeout: 2s
  read-timeout: 5s
  max-attempts: 3
  retry-backoff: 200ms

