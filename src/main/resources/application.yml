spring:
  application:
    name: reading-tracker-server
  cache:
    type: redis
  docker:
    compose:
      enabled: false
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${AUTH0_DOMAIN}
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USER}
    password: ${DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver
  config:
    import: optional:file:.env[.properties]
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        "[format_sql]": true
  data:
    redis:
      url: ${REDIS_URL}
      username: ${REDIS_USER}
      password: ${REDIS_PASSWORD}

server:
  port: 8080

logging:
  level:
    org.springframework.security: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus, loggers, env, beans, metrics, traces
  endpoint:
    health:
      show-details: when-authorized   # never / always / when-authorized
      probes:
        enabled: true                 # enables /liveness and /readiness
  metrics:
    tags:
      application: ${spring.application.name}  # adds tag to every metric
  info:
    git:
      mode: full    # expose git commit SHA, branch in /info
    build:
      enabled: true # expose Maven/Gradle build metadata
  opentelemetry:
    metrics:
      export:
        otlp:
          endpoint: http://localhost:4318/v1/metrics
    tracing:
      export:
        otlp:
          endpoint: http://localhost:4318/v1/traces
    logging:
      export:
        otlp:
          endpoint: http://localhost:4318/v1/logs

open-library:
  base-url: https://openlibrary.org

