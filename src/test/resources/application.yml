spring:
  autoconfigure:
    exclude:
      - org.springframework.modulith.events.config.EventPublicationAutoConfiguration
      - org.springframework.modulith.events.jpa.JpaEventPublicationAutoConfiguration
  cache:
    type: simple

management:
  otlp:
    metrics:
      export:
        enabled: false
  opentelemetry:
    tracing:
      export:
        otlp:
          enabled: false
    logging:
      export:
        otlp:
          enabled: false
