services:
  app1:
    image: ${APP_IMAGE:-myapp:prod}
    env_file:
      - .env.prod
    environment:
      SPRING_PROFILES_ACTIVE: prod

  app2:
    image: ${APP_IMAGE:-myapp:prod}
    env_file:
      - .env.prod
    environment:
      SPRING_PROFILES_ACTIVE: prod

  app3:
    image: ${APP_IMAGE:-myapp:prod}
    env_file:
      - .env.prod
    environment:
      SPRING_PROFILES_ACTIVE: prod

  nginx:
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
