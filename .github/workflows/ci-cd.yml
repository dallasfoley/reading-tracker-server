on:
  push:
    branches: ["main"]
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Run tests
        run: ./mvnw verify
        env:
            # Testcontainers spins up its own Postgres, so these are just
            # placeholders to satisfy Spring's startup property binding.
            # Your @DynamicPropertySource overrides them at runtime.
            DATABASE_URL: jdbc:postgresql://localhost/placeholder
            DATABASE_USER: placeholder
            DATABASE_PASSWORD: placeholder
            AUTH0_DOMAIN: https://test.auth0.invalid/